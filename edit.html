<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Booking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Edit Booking</h1>
    <div class="nav-links"><a href="index.html">Back</a></div>
    <div id="errors"></div>
    <div id="formArea"></div>
  </div>

  <script src="storage.js"></script>
  <script>
    const id = Number(new URLSearchParams(location.search).get("id"));
    const r = Number.isInteger(id) && id > 0 ? getRecordById(id) : null;
    const formArea = document.getElementById("formArea");

    if (!r) {
      formArea.innerHTML = '<p class="muted">Record not found.</p>';
    } else {
      formArea.innerHTML = `
        <form id="editForm">
          <div class="form-group">
            <label for="guest_name">Guest Name</label>
            <input type="text" id="guest_name" maxlength="100" required>
          </div>
          <div class="form-group">
            <label for="room_number">Room Number</label>
            <input type="text" id="room_number" maxlength="20" required>
          </div>
          <div class="form-group">
            <label for="check_in">Check-In Date</label>
            <input type="date" id="check_in" required>
          </div>
          <div class="form-group">
            <label for="check_out">Check-Out Date</label>
            <input type="date" id="check_out" required>
          </div>
          <button type="submit">Update Booking</button>
        </form>
      `;

      document.getElementById("guest_name").value = r.guest_name;
      document.getElementById("room_number").value = r.room_number;
      document.getElementById("check_in").value = r.check_in;
      document.getElementById("check_out").value = r.check_out;

      document.getElementById("editForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const guest_name = document.getElementById("guest_name").value.trim();
        const room_number = document.getElementById("room_number").value.trim();
        const check_in = document.getElementById("check_in").value.trim();
        const check_out = document.getElementById("check_out").value.trim();
        const errors = [];

        if (!guest_name || guest_name.length > 100) errors.push("Guest name is required (max 100 chars).");
        if (!room_number || room_number.length > 20) errors.push("Room number is required (max 20 chars).");
        if (!isValidDateStr(check_in)) errors.push("Check-in date must be valid (YYYY-MM-DD).");
        if (!isValidDateStr(check_out)) errors.push("Check-out date must be valid (YYYY-MM-DD).");
        if (isValidDateStr(check_in) && isValidDateStr(check_out) && check_out <= check_in) {
          errors.push("Check-out date must be later than check-in date.");
        }

        if (errors.length) {
          document.getElementById("errors").innerHTML =
            '<div class="error-box"><ul>' + errors.map(err => `<li>${err}</li>`).join("") + "</ul></div>";
          return;
        }

        updateRecord(r.id, { guest_name, room_number, check_in, check_out });
        location.href = "index.html";
      });
    }
  </script>
</body>
</html>
